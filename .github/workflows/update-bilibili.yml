name: Update Bilibili Plugin

on:
  schedule:
    # Check twice per hour, away from the top-of-hour scheduling peak (UTC).
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Bilibili plugin from upstream
        shell: pwsh
        run: ./tools/update-bilibili.ps1

      - name: Verify custom switches after sync
        run: node --test tests/bilibili-sync.test.cjs

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- Plugins/bilibili.lpx; then
            echo "No Bilibili plugin changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Plugins/bilibili.lpx
          git commit -m "chore: update bilibili plugin from upstream"
          git push
